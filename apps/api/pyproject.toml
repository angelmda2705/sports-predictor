[project]
name = "sports-predictor-api"
version = "0.1.0"
description = "Capa de servicio (FastAPI) de sports-predictor: auth, catálogo y lectura de predicciones."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "SQLAlchemy>=2.0",
    "email-validator>=2.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
